name: Quality Checks

on:
  push:
    branches:
      - main
      - refactor/stage-12
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: enterprise_support
          POSTGRES_USER: enterprise_app
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enterprise_app -d enterprise_support"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DEEPSEEK_API_KEY: ci-placeholder-not-a-real-key
      DEEPSEEK_BASE_URL: https://api.deepseek.com
      DEEPSEEK_MODEL: deepseek-v4-flash
      ADMIN_API_TOKEN: ci-admin-token
      POSTGRES_DB: enterprise_support
      POSTGRES_USER: enterprise_app
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_DB: 0
      ORDER_STATUS_CACHE_TTL_SECONDS: 60
      LLM_TIMEOUT_SECONDS: 30
      AGENT_TIMEOUT_SECONDS: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check app tests

      - name: Mypy
        run: python -m mypy app

      - name: Pytest
        run: python -m pytest -q